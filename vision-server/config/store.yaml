store:
  id: dgi-main
  name: DGI Retail Store
  timezone: Asia/Kolkata
  open_hours: 14
detector:
  weights: models/shelfora-shelf.pt
  conf: 0.35
  iou: 0.5
  product_classes: null
  empty_classes:
  - empty
  - gap
  - void
pipeline:
  interval_sec: 3
  smoothing_frames: 3
  low_stock_threshold: 0.25
sales:
  velocity_window_min: 60
  baseline_days: 28
demo:
  speed: 60
  comment: 1 real second = 60 store seconds when sources are 'simulated'
